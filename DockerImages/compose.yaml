services:
  # One-shot: give the bind-mounted Odoo data dir to the odoo user (uid 101 in the image)
  web-init:
    image: odoo:17.0
    user: root
    entrypoint: ["chown", "-R", "odoo:odoo", "/var/lib/odoo"]
    volumes:
      - ${ODOODATA}:/var/lib/odoo
    restart: "no"

  web:
    image: odoo:17.0
    depends_on:
      web-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ${ODOODATA}:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${DBDATA}:/var/lib/postgresql/data
    secrets:
      - postgresql_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

secrets:
  postgresql_password:
    file: ${PASSWORD_FILE}

