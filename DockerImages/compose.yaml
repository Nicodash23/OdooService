name: odoo_service #definisce un gruppo di container ed il prefisso del nome di essi
services:
  odoo:  #Nome del container 
    image: odoo:20.0  #docker image di odoo 20, da dockerhub
    depends_on: #Dipendenze del container
      - database
    ports: #Porte esposte
      - "8069:8069"
    volumes: # Bindmount delle datadir
      - ${ODOODATA}:/var/lib/odoo
      - ${O_MODULES_DIR}:/mnt/extra-addons
      - ${O_CONFIG_DIR}:/etc/odoo
    environment:  #Varibili d'ambiente
      - HOST=database  #compose passa l'indirizzo del container database come host address ad odoo
      - USER=${DB_USER} 
      - PASSWORD=${DB_PASSWORD}
    networks: #odoo si collega sia alla rete interna di backend sia alla rete collegata all'esterno per esporre il servizio
      - backend #under the hood viene collegata una nuova porta eth al container per ogni network
      - frontend

  database:
    image: postgres:19            #docker image di pg 19, da dockerhub
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER}          #generati con openssl rand -base64 8/20
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${DBDATA}:/var/lib/postgresql
    networks: #postgress è collegato soltanto alla rete interna in modo da impedire accessi diretti al db dall'esterno
      - backend

networks:
  backend:
    internal: true #questa linea elimina il default gateway e crea delle regole sul firewall per bloccare le comunicazioni
  frontend: