name: odoo_adminer 
services:
  adminer:
    image: adminer:latest            
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"        
    environment:
      - ADMINER_DEFAULT_SERVER=database  #nome del servizio postgres sulla rete backend
    networks:
      - backend
      - frontend

networks: #reti già create da compose.yaml
  backend:
    external: true
    name: odoo_service_backend
  frontend:
    external: true
    name: odoo_service_frontend
